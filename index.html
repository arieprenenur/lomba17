<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Lomba 17an RT.01</title>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Pendaftaran Lomba</h1>
        <div id="app">Memuat data...</div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyxs3ZOWuvXTimrIg8znmZIUrppOEppvvVH323PhpvbKHvw1O2I69WkvB_Yg4yWh5kL/exec";

        async function init() {
            try {
                // Fetch data dari Apps Script
                const res = await fetch(`${API_URL}?action=getKategori`);
                const json = await res.json();
                document.getElementById('app').innerHTML = "Data berhasil dimuat!";
            } catch (err) {
                document.getElementById('app').innerHTML = "Error: " + err.message;
            }
        }
        init();
    </script>
</body>
</html>
